name: Build NOVA iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.swift'
      - '**/*.plist'
      - '**/*.xcodeproj/**'
      - '*.zip'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Prepare project (including ZIP uploads)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, zipfile
          for root, _, files in os.walk('.'):
              for name in files:
                  if name.lower().endswith('.zip'):
                      path = os.path.join(root, name)
                      print(f'Checking ZIP: {path}')
                      with zipfile.ZipFile(path) as z:
                          names = [n.replace(chr(92), '/') for n in z.namelist()]
                          if any(n.endswith('.xcodeproj/project.pbxproj') for n in names):
                              print(f'Extracting project archive: {path}')
                              import pathlib, shutil
                              for info in z.infolist():
                                  normalized = info.filename.replace(chr(92), '/')
                                  target = os.path.abspath(os.path.join('.', normalized))
                                  if os.path.commonpath([os.path.abspath('.'), target]) != os.path.abspath('.'):
                                      raise RuntimeError(f'Unsafe ZIP path: {info.filename}')
                                  if info.is_dir() or normalized.endswith('/'):
                                      os.makedirs(target, exist_ok=True)
                                  else:
                                      os.makedirs(os.path.dirname(target), exist_ok=True)
                                      with z.open(info) as src, open(target, 'wb') as dst:
                                          shutil.copyfileobj(src, dst)
                              raise SystemExit(0)
          print('No ZIP containing an Xcode project was found; checking repository files.')
          PY
          if ! find . -name project.pbxproj -print -quit | grep -q .; then
            echo "::error::No Xcode project found. Upload NOVA_iOS12_Swift_Project_fixed.zip or commit the extracted project files to the repository root."
            exit 1
          fi

      - name: Locate project and scheme
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find . -name '*.xcodeproj' -type d -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::No .xcodeproj directory found."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_PATH=$PROJECT_FILE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          # Repair a malformed key found in the uploaded project file.
          python3 - "$PROJECT_FILE/project.pbxproj" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8-sig")
          good = "BuildIndependentTargetsInParallel"
          s, count = re.subn(r"BuildIndependentTargets\\s+in\\s+parallel", good, s)
          if count:
              p.write_text(s, encoding="utf-8")
              print(f"Fixed malformed project setting occurrences: {count}")
          else:
              print("Malformed project setting pattern not present; leaving file unchanged.")
          PY
          echo "=== project.pbxproj full contents (for parse diagnosis) ==="
          cat "$PROJECT_FILE/project.pbxproj"
          echo "=== Ruby plist parser diagnostic ==="
          ruby -e 'require "cfpropertylist"; p CFPropertyList::List.new(file: ARGV[0]).value' "$PROJECT_FILE/project.pbxproj" 2>&1 || true
          echo "=== Xcode project list ==="
          xcodebuild -list -project "$PROJECT_FILE"

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -o pipefail
          PROJECT_NAME="$(basename "$PROJECT_PATH" .xcodeproj)"
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$PROJECT_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::Build succeeded without producing an .app bundle."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qr "$GITHUB_WORKSPACE/NOVA-unsigned.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/NOVA-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/NOVA-unsigned.ipa"

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-unsigned-IPA
          path: NOVA-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
